[package]
name = "spotlight-for-windows"
version = "1.0.0"
description = "Windows-first, keyboard-first, offline-first application launcher"
authors = ["Spotlight Contributors"]
license = "MIT"
edition = "2021"
default-run = "spotlight-for-windows"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.2.0"
tauri-plugin-single-instance = "2.2.0"
tauri-plugin-shell = "2.2.0"

tokio = { version = "1.43", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled", "bundled-full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "7.0"
evalexpr = "12.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
] }
